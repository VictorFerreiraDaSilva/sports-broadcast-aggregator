services:
  # Local Postgres, for development only. It does not come up by default —
  # enable it with `docker compose --profile local-db up -d` when there is no
  # external Postgres. To point at an external one, just set DATABASE_URL in
  # .env and run `docker compose up -d` normally (without the profile).
  db:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fut}
      POSTGRES_DB: ${POSTGRES_DB:-fut}
    volumes:
      - fut_db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fut} -d $${POSTGRES_DB:-fut}"]
      interval: 5s
      timeout: 5s
      retries: 10

  aggregator:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false  # only waits for the local `db` if the "local-db" profile is active
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fut:fut@db:5432/fut}
      FUTNATV_CONTACT_INFO: ${FUTNATV_CONTACT_INFO:-fut-scraper/1.0 (personal use; no contact configured)}
      RUN_ON_STARTUP: ${RUN_ON_STARTUP:-true}
      TZ: ${TZ:-America/Sao_Paulo}
      # Error notifications (ADR 0007). Empty = inert notifier; the errors
      # still go to the log and to `scrape_run`.
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN:-}
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY:-}
      PUSHOVER_APP_NAME: ${PUSHOVER_APP_NAME:-fut}
      PUSHOVER_TIMEOUT_SECONDS: ${PUSHOVER_TIMEOUT_SECONDS:-10}
      DB_WAIT_NOTIFY_AFTER_SECONDS: ${DB_WAIT_NOTIFY_AFTER_SECONDS:-60}
      DB_WAIT_MAX_SECONDS: ${DB_WAIT_MAX_SECONDS:-0}
      MISFIRE_GRACE_SECONDS: ${MISFIRE_GRACE_SECONDS:-300}
    extra_hosts:
      # allows using "host.docker.internal" in DATABASE_URL when the external
      # Postgres runs on the host itself (outside a container) — a no-op otherwise.
      - "host.docker.internal:host-gateway"

volumes:
  fut_db_data:
