services:
  # Postgres local, só para desenvolvimento. Não sobe por padrão — ative com
  # `docker compose --profile local-db up -d` quando não houver um Postgres
  # externo. Para apontar para um externo, basta setar DATABASE_URL no .env e
  # rodar `docker compose up -d` normalmente (sem o profile).
  db:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fut}
      POSTGRES_DB: ${POSTGRES_DB:-fut}
    volumes:
      - fut_db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fut} -d $${POSTGRES_DB:-fut}"]
      interval: 5s
      timeout: 5s
      retries: 10

  aggregator:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false  # só espera o `db` local se o profile "local-db" estiver ativo
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fut:fut@db:5432/fut}
      FUTNATV_CONTACT_INFO: ${FUTNATV_CONTACT_INFO:-fut-scraper/1.0 (uso pessoal; sem contato configurado)}
      RUN_ON_STARTUP: ${RUN_ON_STARTUP:-true}
      TZ: ${TZ:-America/Sao_Paulo}
      # Notificações de erro (ADR 0007). Vazio = notificador inerte; os erros
      # continuam no log e em `scrape_run`.
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN:-}
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY:-}
      PUSHOVER_APP_NAME: ${PUSHOVER_APP_NAME:-fut}
      PUSHOVER_TIMEOUT_SECONDS: ${PUSHOVER_TIMEOUT_SECONDS:-10}
      DB_WAIT_NOTIFY_AFTER_SECONDS: ${DB_WAIT_NOTIFY_AFTER_SECONDS:-60}
      DB_WAIT_MAX_SECONDS: ${DB_WAIT_MAX_SECONDS:-0}
      MISFIRE_GRACE_SECONDS: ${MISFIRE_GRACE_SECONDS:-300}
    extra_hosts:
      # permite usar "host.docker.internal" no DATABASE_URL quando o Postgres
      # externo roda no próprio host (fora de container) — no-op caso contrário.
      - "host.docker.internal:host-gateway"

volumes:
  fut_db_data:
